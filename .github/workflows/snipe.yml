name: leuven-appointment-sniper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: snipe
  cancel-in-progress: false

jobs:
  snipe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check and book
        env:
          FIRST_NAME: ${{ secrets.FIRST_NAME }}
          LAST_NAME: ${{ secrets.LAST_NAME }}
          DOB: ${{ secrets.DOB }}
          EMAIL: ${{ secrets.EMAIL }}
          PHONE: ${{ secrets.PHONE }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PEOPLE: "4"
          DEADLINE: "2026-10-15"
          MIN_LEAD_MINUTES: "30"
        run: python snipe.py
      - name: Save state
        if: always()
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "sniper-bot"
            git config user.email "sniper-bot@users.noreply.github.com"
            git add state.json
            git commit -m "state: update bookings

          Ledger: none — automated state file update"
            git pull --rebase
            git push
          fi
